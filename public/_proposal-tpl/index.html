<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>ข้อเสนอจาก ปัน ณัฐพัชร์</title>
<meta property="og:title" content="ข้อเสนอจาก ปัน ณัฐพัชร์">
<meta property="og:description" content="เปิดเพื่อดูขอบเขตงาน ตัวเลือก และราคา">
<meta property="og:image" content="https://punnattapatch.com/og-image.jpg">
<link rel="icon" href="/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Interactive proposal template. Served by Worker offer-api at /proposal/<slug> (knowledge repo mac-mini-ops/offer-api).
     No third-party scripts on purpose: the URL carries a secret slug, pixels would leak it. -->
<style>
  :root{--navy:#072b4e;--coral:#dd4155;--ink:#1d2733;--muted:#5b6673;--line:#e3e7ec;--bg:#f6f7f9;--card:#fff;--ok:#1f7a4d;--r:14px}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Sarabun",sans-serif}
  h1,h2,h3{font-family:"Prompt",sans-serif;line-height:1.3;margin:0}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 140px}
  header.top{background:var(--navy);color:#fff}
  header.top .wrap{padding:28px 16px 24px}
  .eyebrow{font-size:14px;opacity:.8}
  h1{font-size:26px;margin:6px 0 10px}
  .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;opacity:.9}
  section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px;margin-top:16px}
  h2{font-size:19px;color:var(--navy);margin-bottom:10px}
  h3{font-size:16px;margin-bottom:4px}
  /* house rule: no bullet dots in customer-facing text, so lists are spaced lines (TL;DR is numbered) */
  ul.plain,.opt ul{margin:0;padding:0;list-style:none}
  ul.plain li{margin:0 0 10px}
  ul.plain li:last-child{margin-bottom:0}
  ol.tl-num{margin:0;padding-left:22px}
  ol.tl-num li{margin:0 0 8px;padding-left:2px}
  .opt ul li::before{content:"✓ ";color:var(--coral);font-weight:700}
  .tldr{border-color:var(--navy);border-width:2px}
  .item{padding:10px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:0;padding-top:0}
  .lbl{color:var(--muted);font-weight:600}
  .tl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
  .tl .when{font-weight:700;color:var(--navy);white-space:nowrap}
  .group{margin-top:14px}
  .group:first-of-type{margin-top:0}
  .glabel{font-weight:700;margin-bottom:8px}
  .opt{display:block;position:relative;border:2px solid var(--line);border-radius:12px;padding:14px 14px 14px 48px;margin:10px 0;cursor:pointer;transition:border-color .15s,background .15s,transform .08s}
  .opt:active{transform:scale(.99)}
  .opt input{position:absolute;left:16px;top:18px;width:20px;height:20px;accent-color:var(--coral)}
  .opt.on{border-color:var(--coral);background:#fff6f7}
  .opt .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .opt .name{font-weight:700}
  .opt .price{font-family:"Prompt",sans-serif;font-weight:600;white-space:nowrap}
  .opt .list{color:var(--muted);text-decoration:line-through;font-size:14px;margin-right:6px}
  .opt .desc{color:var(--muted);font-size:15px;margin-top:4px}
  .opt ul{margin-top:6px;font-size:15px}
  .total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--navy);margin-top:14px;padding-top:12px}
  .total b{font-family:"Prompt",sans-serif;font-size:24px;color:var(--navy)}
  details{border-top:1px solid var(--line);padding:10px 0}
  details:first-of-type{border-top:0}
  summary{font-weight:600;cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"＋";float:right;color:var(--muted)}
  details[open] summary::after{content:"－"}
  .next{border-color:var(--coral);border-width:2px}
  .btns{display:grid;gap:10px;margin-top:14px}
  button,.btn{font:600 16px "Prompt",sans-serif;border-radius:12px;padding:14px 16px;border:0;cursor:pointer;text-align:center;text-decoration:none;display:block;min-height:48px;transition:transform .08s,opacity .15s}
  button:active,.btn:active{transform:scale(.98)}
  button:disabled{opacity:.6;cursor:wait}
  .primary{background:var(--coral);color:#fff}
  .ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
  .line{background:#06c755;color:#fff}
  .note{font-size:14px;color:var(--muted);margin-top:8px}
  .msg{margin-top:12px;padding:12px 14px;border-radius:10px;font-weight:600;display:none}
  .msg.show{display:block}
  .msg.ok{background:#e8f6ee;color:var(--ok)}
  .msg.err{background:#fdecee;color:#a3192b}
  .banner{background:#fff4d6;border:1px solid #f0d27a;border-radius:var(--r);padding:14px 16px;margin-top:16px;font-weight:600}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(7,43,78,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .bar .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
  .bar .sum{font-size:14px;color:var(--muted)}
  .bar .sum b{display:block;font:600 20px "Prompt",sans-serif;color:var(--navy)}
  .bar button{padding:12px 18px}
  .center{text-align:center;padding:80px 16px}
  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media print{
    body{background:#fff;font-size:13px}
    .bar,.btns,.noprint,.note{display:none!important}
    header.top{background:#fff;color:var(--ink);border-bottom:2px solid var(--navy)}
    section{break-inside:avoid;border-color:#ccc}
    .opt:not(.on){display:none}
    .opt{padding-left:14px}
    .opt input{display:none}
    details{display:block}
    details>*{display:block}
    summary::after{content:""}
    .wrap{padding-bottom:0}
  }
</style>
</head>
<body>
<div id="app"><div class="center">กำลังโหลดข้อเสนอ</div></div>

<script>
(function () {
  var slug = location.pathname.split("/").filter(Boolean)[1] || "";
  var app = document.getElementById("app");
  var ua = navigator.userAgent || "";
  var inLine = / Line\//i.test(ua), inFb = /FBAN|FBAV|Instagram/i.test(ua);
  var data, sending = false;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function thb(n) { return Number(n || 0).toLocaleString("en-US") + " บาท"; }
  function thDate(iso) {
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00+07:00");
    return d.toLocaleDateString("th-TH", { day: "numeric", month: "long", year: "numeric", timeZone: "Asia/Bangkok" });
  }
  function list(arr) { return "<ul class=\"plain\">" + (arr || []).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"; }
  function send(evt, extra) {
    var body = JSON.stringify(Object.assign({ evt: evt }, extra || {}));
    return fetch("/api/proposal/" + slug + "/event", { method: "POST", headers: { "content-type": "application/json" }, body: body, keepalive: true })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error || r.status); return j; }); });
  }

  function stateScreen(title, body, lineUrl) {
    app.innerHTML = "<div class=\"center\"><h1 style=\"color:var(--navy)\">" + esc(title) + "</h1><p>" + esc(body) + "</p>" +
      (lineUrl ? "<a class=\"btn line\" style=\"max-width:320px;margin:20px auto 0\" href=\"" + esc(lineUrl) + "\">ติดต่อผู้ให้บริการทาง LINE</a>" : "") + "</div>";
  }

  // ---------------------------------------------------------------- selection
  function groups() {
    var out = [], idx = {};
    (data.options || []).forEach(function (o) {
      if (!(o.group in idx)) { idx[o.group] = out.length; out.push({ key: o.group, label: o.group_label || "", type: o.type, opts: [] }); }
      out[idx[o.group]].opts.push(o);
    });
    return out;
  }
  function selected() {
    return Array.prototype.map.call(document.querySelectorAll(".opt input:checked"), function (i) { return i.value; });
  }
  function recalc() {
    var keys = selected(), total = 0;
    (data.options || []).forEach(function (o) { if (keys.indexOf(o.key) >= 0) total += Number(o.price_thb) || 0; });
    document.querySelectorAll(".opt").forEach(function (el) { el.classList.toggle("on", el.querySelector("input").checked); });
    document.querySelectorAll("[data-total]").forEach(function (el) { el.textContent = thb(total); });
    try { history.replaceState(null, "", "#sel=" + keys.join(",")); } catch (e) {}
  }
  function restore() {
    var m = location.hash.match(/sel=([a-z0-9_,-]*)/i);
    if (!m) return;
    var keys = m[1].split(",");
    // radios: checking one unchecks its siblings, so groups without a saved key keep their default
    document.querySelectorAll(".opt input").forEach(function (i) {
      if (i.type === "checkbox") i.checked = keys.indexOf(i.value) >= 0;
      else if (keys.indexOf(i.value) >= 0) i.checked = true;
    });
  }

  function optionsHtml() {
    var gs = groups();
    if (!gs.length) return "";
    var live = data.state === "live";
    return "<section id=\"choose\"><h2>ตัวเลือกและค่าบริการ</h2>" +
      (gs.length && live ? "<p class=\"note noprint\" style=\"margin-top:0\">ผู้ว่าจ้างเลือกได้เองตามที่เหมาะกับทีม ยอดรวมจะปรับตามตัวเลือก</p>" : "") +
      gs.map(function (g) {
        return "<div class=\"group\">" + (g.label ? "<div class=\"glabel\">" + esc(g.label) + "</div>" : "") +
          g.opts.map(function (o) {
            var type = g.type === "radio" ? "radio" : "checkbox";
            return "<label class=\"opt\"><input type=\"" + type + "\" name=\"g_" + esc(g.key) + "\" value=\"" + esc(o.key) + "\"" +
              (o.default ? " checked" : "") + (live ? "" : " disabled") + ">" +
              "<div class=\"row\"><span class=\"name\">" + esc(o.label) + "</span><span class=\"price\">" +
              (o.list_price_thb ? "<span class=\"list\">" + thb(o.list_price_thb) + "</span>" : "") + (Number(o.price_thb) ? thb(o.price_thb) : "ไม่มีค่าใช้จ่ายเพิ่ม") + "</span></div>" +
              (o.desc ? "<div class=\"desc\">" + esc(o.desc) + "</div>" : "") +
              (o.includes && o.includes.length ? list(o.includes).replace("plain", "") : "") + "</label>";
          }).join("") + "</div>";
      }).join("") +
      "<div class=\"total\"><span>ยอดรวมตามที่เลือก</span><b data-total></b></div>" +
      (data.content.price_note ? "<p class=\"note\">" + esc(data.content.price_note) + "</p>" : "") + "</section>";
  }

  function render() {
    var c = data.content || {};
    var live = data.state === "live";
    var h = "";
    h += "<header class=\"top\"><div class=\"wrap\"><div class=\"eyebrow\">ข้อเสนอสำหรับ " + esc(data.client) + "</div><h1>" + esc(data.title) + "</h1>" +
      "<div class=\"meta\"><span>ฉบับวันที่ " + esc(thDate(data.issued)) + "</span>" +
      (data.valid_until ? "<span>ราคานี้ยืนถึง " + esc(thDate(data.valid_until)) + "</span>" : "") + "</div></div></header><div class=\"wrap\">";
    if (data.state === "expired") h += "<div class=\"banner\">ข้อเสนอฉบับนี้พ้นกำหนดยืนราคาแล้ว กรุณาติดต่อผู้ให้บริการเพื่อขอฉบับปรับปรุง</div>";
    if (c.tldr && c.tldr.length) h += "<section class=\"tldr\"><h2>สรุปสั้น (TL;DR)</h2><ol class=\"tl-num\">" + c.tldr.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol></section>";
    (c.sections || []).forEach(function (s) {
      h += "<section><h2>" + esc(s.heading) + "</h2>" + (s.body ? s.body.map(function (p) { return "<p style=\"margin:0 0 8px\">" + esc(p) + "</p>"; }).join("") : "") +
        (s.items || []).map(function (it) {
          return "<div class=\"item\"><h3>" + esc(it.title) + "</h3>" +
            (it.what ? "<div><span class=\"lbl\">ทำอะไร </span>" + esc(it.what) + "</div>" : "") +
            (it.why ? "<div><span class=\"lbl\">เพื่ออะไร </span>" + esc(it.why) + "</div>" : "") + "</div>";
        }).join("") + "</section>";
    });
    if (c.timeline && c.timeline.length) h += "<section><h2>ลำดับเวลา</h2><div class=\"tl\">" + c.timeline.map(function (t) { return "<div class=\"when\">" + esc(t.when) + "</div><div>" + esc(t.what) + "</div>"; }).join("") + "</div></section>";
    if (c.excluded && c.excluded.length) h += "<section><h2>สิ่งที่ไม่รวมในข้อเสนอนี้</h2>" + list(c.excluded) + "</section>";
    h += optionsHtml();
    if (c.terms && c.terms.length) h += "<section><h2>เงื่อนไข</h2>" + list(c.terms) + "</section>";
    if (c.faq && c.faq.length) h += "<section><h2>คำถามที่พบบ่อย</h2>" + c.faq.map(function (f) { return "<details><summary>" + esc(f.q) + "</summary><p style=\"margin:8px 0 0\">" + esc(f.a) + "</p></details>"; }).join("") + "</section>";
    if (c.proof && c.proof.length) h += "<section><h2>ผู้ให้บริการ</h2>" + list(c.proof) + "</section>";
    h += "<section class=\"next\"><h2>ขั้นถัดไป</h2>" +
      "<p style=\"margin:0\">" + esc(c.next_step || "เมื่อผู้ว่าจ้างส่งตัวเลือก ผู้ให้บริการจะติดต่อยืนยันรายละเอียดทาง LINE แล้วจึงออกใบเสนอราคาและแจ้งช่องทางชำระเงิน") + "</p>" +
      (data.decision_date ? "<p style=\"margin:8px 0 0\"><span class=\"lbl\">นัดตัดสินใจ </span>" + esc(thDate(data.decision_date)) + "</p>" : "") +
      "<div class=\"btns\">" +
      (live && (data.options || []).length ? "<button class=\"primary\" id=\"bChoose\">ส่งตัวเลือกนี้ให้ผู้ให้บริการ</button>" : "") +
      "<button class=\"ghost\" id=\"bPdf\">บันทึกเป็น PDF</button>" +
      (data.qo_pdf_url ? "<a class=\"btn ghost\" href=\"" + esc(data.qo_pdf_url) + "\" target=\"_blank\" rel=\"noopener noreferrer\">ดาวน์โหลดใบเสนอราคา (PDF)</a>" : "") +
      "<a class=\"btn line\" id=\"bLine\" href=\"" + esc(data.line_url) + "\">คุยกับผู้ให้บริการทาง LINE</a></div>" +
      "<div class=\"msg\" id=\"msg\" role=\"status\" aria-live=\"polite\"></div>" +
      "<p class=\"note\">การส่งตัวเลือกยังไม่ถือเป็นการตกลงว่าจ้าง ผู้ให้บริการจะยืนยันกับผู้ว่าจ้างก่อนทุกครั้ง</p></section>";
    h += "</div>";
    if (live && (data.options || []).length) h += "<div class=\"bar noprint\"><div class=\"in\"><div class=\"sum\">ยอดรวม<b data-total></b></div><button class=\"primary\" id=\"bChoose2\">ส่งตัวเลือก</button></div></div>";
    app.innerHTML = h;

    restore();
    recalc();
    app.addEventListener("change", function (e) { if (e.target.matches(".opt input")) recalc(); });
    var bc = document.getElementById("bChoose"), bc2 = document.getElementById("bChoose2");
    if (bc) bc.onclick = choose;
    if (bc2) bc2.onclick = function () { document.getElementById("bChoose").scrollIntoView({ behavior: "smooth", block: "center" }); choose(); };
    document.getElementById("bPdf").onclick = savePdf;
    document.getElementById("bLine").addEventListener("click", function () { if (live) send("line").catch(function () {}); });
    if (/print=1/.test(location.hash)) say("ok", "กดปุ่ม บันทึกเป็น PDF อีกครั้ง แล้วเลือก บันทึกเป็น PDF ในหน้าพิมพ์");
  }

  function say(kind, text) {
    var m = document.getElementById("msg");
    m.className = "msg show " + kind;
    m.textContent = text;
  }

  function choose() {
    if (sending) return;
    sending = true;
    var b = document.getElementById("bChoose");
    b.disabled = true;
    send("choose", { selection: selected() }).then(function () {
      say("ok", "ผู้ให้บริการได้รับตัวเลือกแล้ว และจะติดต่อยืนยันกับท่านทาง LINE");
      b.textContent = "ส่งตัวเลือกแล้ว (ส่งใหม่ได้ถ้าเปลี่ยนตัวเลือก)";
    }).catch(function () {
      say("err", "ส่งไม่สำเร็จ กรุณาลองอีกครั้ง หรือแจ้งตัวเลือกกับผู้ให้บริการทาง LINE");
    }).then(function () { sending = false; b.disabled = false; });
  }

  function savePdf() {
    var keys = selected().join(",");
    if (inLine) {
      location.href = location.pathname + "?openExternalBrowser=1#sel=" + keys + "&print=1";
      return;
    }
    if (inFb) {
      say("ok", "แอปนี้บันทึก PDF ไม่ได้ กรุณากดเมนูมุมขวาบน แล้วเลือกเปิดในเบราว์เซอร์ จากนั้นกดบันทึกเป็น PDF อีกครั้ง");
      return;
    }
    if (data.state === "live") send("pdf", { selection: selected() }).catch(function () {});
    window.print();
  }

  if (!/^[0-9a-f]{32}$/.test(slug)) { stateScreen("ไม่พบข้อเสนอ", "ลิงก์นี้ไม่ถูกต้อง กรุณาตรวจลิงก์กับผู้ให้บริการ"); return; }
  fetch("/api/proposal/" + slug, { headers: { accept: "application/json" } })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      data = j;
      if (j.state === "missing") return stateScreen("ไม่พบข้อเสนอ", "ลิงก์นี้ไม่ถูกต้อง กรุณาตรวจลิงก์กับผู้ให้บริการ");
      if (j.state === "void") return stateScreen("ข้อเสนอนี้ถูกยกเลิกแล้ว", "กรุณาติดต่อผู้ให้บริการหากต้องการข้อเสนอฉบับใหม่", "https://lin.ee/ioSnSUG");
      if (j.state === "superseded") {
        if (j.new_slug) { location.replace("/proposal/" + j.new_slug); return; }
        return stateScreen("มีข้อเสนอฉบับใหม่แทนฉบับนี้แล้ว", "กรุณาขอลิงก์ฉบับล่าสุดจากผู้ให้บริการ", j.line_url);
      }
      document.title = j.title + " | ข้อเสนอสำหรับ " + j.client;
      render();
      if (j.state === "live" && !/print=1/.test(location.hash)) send("open").catch(function () {});
    })
    .catch(function () { stateScreen("เปิดข้อเสนอไม่สำเร็จ", "กรุณาลองใหม่อีกครั้ง หรือติดต่อผู้ให้บริการทาง LINE", "https://lin.ee/ioSnSUG"); });
})();
</script>
</body>
</html>
