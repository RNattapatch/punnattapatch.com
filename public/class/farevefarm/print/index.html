    // ===== END CONFIG =====

    // ===== notebook sheet · shared by class-room + action-plan (redesign 2026-10-13) =====
    const NB_TAPE = ["#BFE3F5", "#E2D4F5", "#F9C6D6", "#FFD8A8", "#CDEBD6"];
    const NB_INK = ["#1E5A8C", "#6B4C9A", "#C0396B", "#B4581A", "#2E7D5B"];
    const nbEsc = (s) => String(s ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
    const NB_HOLES = `<div class="holes" aria-hidden="true"><i></i><i></i><i></i></div>`;
    // date = the day the page is opened (Thai Buddhist calendar, e.g. "14 ต.ค. 2569") unless someone typed another one
    const nbToday = () => new Date().toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" });
    // c = { brand, className, date, plan } · field(key, placeholder, inline) returns the writable area HTML
    function nbSheet(c, field) {
      const P = c.plan;
      const spans = P.columns.length === 5 ? [2, 2, 2, 4, 2] : P.columns.map(() => 2);
      const secs = P.columns.map((col, i) => {
        const title = col.title === "__FOLLOWUP__" ? P.followUpLabel : col.title;
        const k = i % NB_TAPE.length;
        const slots = col.slots.map((s, j) => /^\d+$/.test(s)
          ? `<div class="slot num"><b style="color:${NB_INK[k]}">${nbEsc(s)}.</b><div class="lines">${field(`c${i}s${j}`)}</div></div>`
          : `<div class="slot"><span class="lab" style="color:${NB_INK[k]}">${nbEsc(s)}</span><div class="lines">${field(`c${i}s${j}`)}</div></div>`).join("");
        return `<section class="nb-sec${spans[i] >= 4 ? " wide" : ""}" style="grid-column:span ${spans[i]}">
          <span class="tape" style="background:${NB_TAPE[k]}"><span style="color:${NB_INK[k]}">${i + 1}</span>${nbEsc(title)}</span>
          <div class="nb-hint">${nbEsc(col.hint)}</div><div class="slots">${slots}</div></section>`;
      }).join("");
      return `<article class="sheet nb">${NB_HOLES}
        <header class="nb-top"><div><div class="nb-brand">${nbEsc(c.brand)}</div><h1 class="nb-title">${nbEsc(P.title)}</h1><div class="nb-sub">${nbEsc(P.subtitle)}</div></div>
          <div class="nb-fields"><div><b>ชื่อ</b>${field("name", "พิมพ์ชื่อ", true)}</div><div><b>คลาส</b>${field("cls", "พิมพ์ชื่อคลาส", true)}</div><div><b>วันที่</b>${field("date", "", true, nbToday())}</div></div></header>
        <div class="nb-grid">${secs}</div>
        <div class="nb-bottom${P.bring ? "" : " solo"}">
          <div class="sticky"><div><h3>${nbEsc(P.commitTitle)}</h3><p>${nbEsc(P.commitHint)}</p><div class="lines">${field("commit")}</div></div>
            <div class="sign"><div><span>ลงชื่อ</span>${field("sign", "", true)}</div><div><span>คู่หูที่จะช่วยเตือน</span>${field("buddy", "", true)}</div></div></div>
          ${P.bring ? `<div class="clip"><span class="cut" aria-hidden="true">✂</span>${P.bring}</div>` : ""}
        </div></article>`;
    }
    function nbRecap(c) {
      if (!c.plan.recapHtml) return "";
      return `<article class="sheet nb">${NB_HOLES}<header class="nb-top"><div><div class="nb-brand">${nbEsc(c.brand)}</div><h1 class="nb-title">สรุป 1 หน้า · ติดไว้ข้างจอ</h1></div>
        <div class="nb-fields" style="grid-template-columns:auto"><div><b>วันที่</b> ${nbEsc(nbToday())}</div></div></header>${c.plan.recapHtml}</article>`;
    }
    const blank = (key, ph, inline, def = "") => `<div class="${inline ? "inline-ed" : "ed"}">${nbEsc(def)}</div>`;
    const C2 = { brand: CONFIG.brand, className: CONFIG.className, date: CONFIG.date, plan: CONFIG };
    document.getElementById("root").innerHTML = nbSheet(C2, blank) + nbRecap(C2);
  </script>
</body>
</html>
